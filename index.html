<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koi Pond</title>
    <link rel="icon" href="./icons/icon48.png" />
    <style>
      /* Nothing but the water: no cursor over it either, for a TV or a kiosk. */
      body {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <!-- The wallpaper: the water on its own, full screen (src/wallpaper.ts). The same layers as the
         new tab page: its floor, the fish, the beach's crab, then (on top) the stream's leaves, the
         pond's lilies, the surface, the stream's bubbles, the beach's and the reef's particles, and the
         beach's gulls. -->
    <canvas class="water" aria-hidden="true" data-water="0"></canvas>
    <canvas class="boids" aria-hidden="true" data-fish-shadows></canvas>
    <canvas class="boids" aria-hidden="true" data-boids></canvas>
    <canvas class="water" aria-hidden="true" data-shore></canvas>
    <canvas class="water" aria-hidden="true" data-leaves></canvas>
    <canvas class="water" aria-hidden="true" data-lilies></canvas>
    <canvas class="water" aria-hidden="true" data-water="1"></canvas>
    <canvas class="water" aria-hidden="true" data-bubbles></canvas>
    <canvas class="water" aria-hidden="true" data-spray></canvas>
    <canvas class="water" aria-hidden="true" data-fused></canvas>
    <canvas class="water" aria-hidden="true" data-goo></canvas>
    <canvas class="water" aria-hidden="true" data-reef-spray></canvas>
    <canvas class="water" aria-hidden="true" data-reef-fused></canvas>
    <canvas class="water" aria-hidden="true" data-reef-goo></canvas>
    <canvas class="water" aria-hidden="true" data-sky></canvas>
    <script type="module" src="/src/wallpaper.ts"></script>
  </body>
</html>
