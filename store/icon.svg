<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <!-- The extension's icon: a kohaku koi gliding past a lily pad, over jade water, in the new tab's
       flat style (hard shadows on the bed). Rendered to PNGs by store/render.py. -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7a63" />
      <stop offset="1" stop-color="#14423d" />
    </linearGradient>
    <path id="body" d="M25.0,25.5 C23.6,27.2 24.6,31.8 25.9,35.1 C27.3,38.4 30.2,41.7 33.3,45.4 C36.3,49.1 40.5,53.5 44.3,57.1 C48.0,60.7 52.1,63.8 55.7,66.9 C59.3,70.0 62.8,72.6 65.8,75.7 C68.8,78.7 71.6,84.1 73.7,85.2 C75.8,86.4 78.2,85.2 78.3,82.8 C78.4,80.3 75.9,74.6 74.2,70.3 C72.6,66.0 70.7,61.6 68.3,57.1 C65.9,52.5 63.3,47.3 59.7,42.9 C56.1,38.5 51.0,33.6 46.7,30.6 C42.4,27.6 37.7,25.8 34.1,24.9 C30.4,24.1 26.4,23.8 25.0,25.5Z" />
    <path id="tail" d="M74,82 C70,92 72,100 76,106 C78,99 81,95 85,93 C91,97 98,98 104,96 C98,91 90,85 79,81 Z" />
    <path id="pad" d="M0,0 L15.5,-4 A16,16 0 1 1 9,-13 Z" />
    <clipPath id="clip"><use href="#body" /></clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#water)" />

  <!-- shadows on the bed -->
  <g fill="#000" opacity="0.22">
    <use href="#pad" transform="translate(100 39)" />
    <g transform="translate(6 8)">
      <use href="#body" />
      <use href="#tail" />
    </g>
  </g>

  <!-- the koi: translucent fins, a white body with red patches -->
  <g fill="#fff" opacity="0.6">
    <use href="#tail" />
    <ellipse cx="31" cy="47" rx="8" ry="3.6" transform="rotate(118 31 47)" />
    <ellipse cx="49" cy="29" rx="8" ry="3.6" transform="rotate(-28 49 29)" />
  </g>
  <use href="#body" fill="#fbf7f2" />
  <g clip-path="url(#clip)" fill="#e2452b">
    <ellipse cx="33" cy="33" rx="8" ry="6.5" transform="rotate(42 33 33)" />
    <ellipse cx="54" cy="54" rx="10" ry="6" transform="rotate(48 54 54)" />
    <ellipse cx="69" cy="72" rx="4.5" ry="3" transform="rotate(55 69 72)" />
  </g>

  <!-- a lily pad, its notch towards the middle -->
  <use href="#pad" transform="translate(94 33)" fill="#79a64a" />
</svg>
