<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
  </head>
  <body>
    <!-- The water, in layers: its floor, the fish, then (on top) the stream's leaves, the pond's lilies,
         the surface and the stream's bubbles. -->
    <canvas class="water" aria-hidden="true" data-water="0"></canvas>
    <canvas class="boids" aria-hidden="true" data-boids></canvas>
    <canvas class="water" aria-hidden="true" data-leaves></canvas>
    <canvas class="water" aria-hidden="true" data-lilies></canvas>
    <canvas class="water" aria-hidden="true" data-water="1"></canvas>
    <canvas class="water" aria-hidden="true" data-bubbles></canvas>

    <main class="overlay">
      <div class="clock" data-clock hidden>
        <div class="clock-time" data-clock-time></div>
        <div class="clock-date" data-clock-date></div>
      </div>
      <form class="search" role="search" data-search hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input type="search" name="q" placeholder="Search the web" aria-label="Search the web" autocomplete="off" />
      </form>
    </main>

    <button class="gear" type="button" title="Settings" aria-label="Settings" data-open-settings>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
    </button>

    <dialog class="settings" aria-labelledby="settings-title" data-settings>
      <form method="dialog" data-form>
        <header>
          <h2 id="settings-title">Settings</h2>
          <button class="close" value="close" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </header>

        <fieldset>
          <legend>Scene</legend>
          <div class="pills">
            <label><input class="visually-hidden" type="radio" name="scene" value="random" />Random</label>
            <label><input class="visually-hidden" type="radio" name="scene" value="ocean" />Reef</label>
            <label><input class="visually-hidden" type="radio" name="scene" value="stream" />Stream</label>
            <label><input class="visually-hidden" type="radio" name="scene" value="pond" />Pond</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Time of day</legend>
          <div class="pills">
            <label><input class="visually-hidden" type="radio" name="time" value="auto" />Auto</label>
            <label><input class="visually-hidden" type="radio" name="time" value="day" />Day</label>
            <label><input class="visually-hidden" type="radio" name="time" value="night" />Night</label>
          </div>
          <div class="times" data-times>
            <label>Day from <input type="time" name="dayFrom" required /></label>
            <label>Night from <input type="time" name="nightFrom" required /></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Show</legend>
          <label class="check"><input type="checkbox" name="clock" />Clock</label>
          <label class="check"><input type="checkbox" name="search" />Search box</label>
        </fieldset>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
